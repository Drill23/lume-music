name: LumeMusic
options:
  bundleIdPrefix: com.adriano
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 73HPGSC9QX
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
targets:
  LumeMusic:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: App
    entitlements:
      path: App/LumeMusic.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriano.lumemusic.ios
        MARKETING_VERSION: "5.0.0"
        CURRENT_PROJECT_VERSION: 7
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lume Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: false
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSAppleMusicUsageDescription: O Lume Music acessa sua biblioteca do Apple Music apenas quando você toca em Importar para trazer suas playlists e faixas em 1 clique.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.adriano.lumemusic
            CFBundleURLSchemes: [lumemusic]
