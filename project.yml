name: LumeMusic
options:
  bundleIdPrefix: com.adriano
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: 73HPGSC9QX
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
targets:
  LumeMusic:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: LumeWidget
        embed: true
    entitlements:
      path: App/LumeMusic.entitlements
      properties:
        com.apple.security.application-groups: [group.com.adriano.lumemusic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriano.lumemusic.ios
        # LUME_APP: o código compartilhado com o widget (Shared/) só toca o AudioPlayer no app.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LUME_APP"
        MARKETING_VERSION: "5.2.4"
        CURRENT_PROJECT_VERSION: 20
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lume Music
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR]
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiresFullScreen: false
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSAppleMusicUsageDescription: O Lume Music acessa sua biblioteca do Apple Music apenas quando você toca em Importar para trazer suas playlists e faixas em 1 clique.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.adriano.lumemusic
            CFBundleURLSchemes: [lumemusic]
  # Widget "Tocando agora" (WidgetKit). Mantenha MARKETING_VERSION / CURRENT_PROJECT_VERSION IGUAIS aos do app
  # (scripts/build-ipa.sh também força os mesmos valores nos dois alvos).
  LumeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: LumeWidget
        excludes:
          - Info.plist
      - path: Shared
    entitlements:
      path: LumeWidget/LumeWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.adriano.lumemusic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriano.lumemusic.ios.LumeWidget
        MARKETING_VERSION: "5.2.4"
        CURRENT_PROJECT_VERSION: 20
        TARGETED_DEVICE_FAMILY: '1,2'
        SKIP_INSTALL: YES
        INFOPLIST_FILE: LumeWidget/Info.plist
    info:
      path: LumeWidget/Info.plist
      properties:
        CFBundleDisplayName: Lume Music
        CFBundleDevelopmentRegion: pt-BR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
